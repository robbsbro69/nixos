<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;600&family=Syne:wght@400;600;700&display=swap');

:root{
  --base:#1e1e2e;--mantle:#181825;--crust:#11111b;
  --surface0:#313244;--surface1:#45475a;--surface2:#585b70;
  --overlay0:#6c7086;--overlay1:#7f849c;
  --text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;
  --lavender:#b4befe;--blue:#89b4fa;--sapphire:#74c7ec;
  --teal:#94e2d5;--green:#a6e3a1;--yellow:#f9e2af;
  --peach:#fab387;--maroon:#eba0ac;--red:#f38ba8;
  --mauve:#cba6f7;--pink:#f5c2e7;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--base);
  color:var(--text);
  font-family:'Syne',system-ui,sans-serif;
  min-height:100vh;
  padding:1.5rem 1.2rem;
}

.wrap{max-width:1200px;margin:0 auto;}

/* ── TOP BAR ── */
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:1.5rem;
  flex-wrap:wrap;
  gap:1rem;
}

/* Clock */
.clock-block{text-align:center;}
.clock-time{
  font-family:'JetBrains Mono',monospace;
  font-size:4rem;
  font-weight:200;
  color:var(--lavender);
  letter-spacing:.04em;
  line-height:1;
}
.clock-date{color:var(--subtext0);font-size:.78rem;margin-top:.2rem;letter-spacing:.04em;}
.greeting{color:var(--mauve);font-size:.95rem;font-weight:600;margin-top:.3rem;}

/* Streak */
.streak-block{
  background:var(--mantle);
  border:1.5px solid var(--surface0);
  border-radius:16px;
  padding:1rem 1.4rem;
  text-align:center;
  min-width:180px;
}
.streak-label{font-size:.7rem;color:var(--subtext0);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem;}
.streak-num{
  font-family:'JetBrains Mono',monospace;
  font-size:2.8rem;
  font-weight:200;
  color:var(--peach);
  line-height:1;
}
.streak-sub{font-size:.72rem;color:var(--overlay1);margin-top:.2rem;}
.streak-bar-wrap{margin-top:.6rem;background:var(--surface0);border-radius:99px;height:5px;overflow:hidden;}
.streak-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--maroon));transition:width .6s;}

/* ── SEARCH ── */
.search-wrap{
  max-width:560px;
  margin:0 auto 1.5rem;
  display:flex;
  gap:8px;
}
.search-wrap input{
  flex:1;
  background:var(--mantle);
  border:1.5px solid var(--surface1);
  border-radius:12px;
  padding:.65rem 1rem;
  color:var(--text);
  font-size:.9rem;
  font-family:'Syne',sans-serif;
  outline:none;
  transition:border-color .2s;
}
.search-wrap input:focus{border-color:var(--mauve);}
.search-wrap input::placeholder{color:var(--overlay0);}
.engine-btn{
  background:var(--surface0);
  border:1.5px solid var(--surface1);
  border-radius:10px;
  padding:0 .8rem;
  color:var(--subtext1);
  font-size:.75rem;
  font-weight:600;
  font-family:'Syne',sans-serif;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s;
}
.engine-btn:hover{background:var(--surface1);color:var(--text);}
.search-btn{
  background:var(--mauve);
  color:var(--base);
  border:none;
  border-radius:10px;
  padding:.65rem 1.1rem;
  cursor:pointer;
  font-weight:700;
  font-size:.85rem;
  font-family:'Syne',sans-serif;
  transition:opacity .15s;
}
.search-btn:hover{opacity:.85;}

/* ── MAIN LAYOUT ── */
.main-row{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:1rem;
  align-items:start;
}
@media(max-width:860px){.main-row{grid-template-columns:1fr;}}

/* ── BOOKMARKS GRID ── */
.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:.7rem;
}
.section-header-label{
  font-size:.75rem;
  color:var(--subtext0);
  letter-spacing:.05em;
  text-transform:uppercase;
  font-weight:600;
}
.add-section-btn{
  font-size:.75rem;
  padding:.3rem .7rem;
  border:1.5px solid var(--surface1);
  border-radius:8px;
  color:var(--mauve);
  background:none;
  cursor:pointer;
  font-family:'Syne',sans-serif;
  font-weight:600;
  transition:all .15s;
}
.add-section-btn:hover{background:var(--surface0);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.85rem;}

.card{
  background:var(--mantle);
  border:1.5px solid var(--surface0);
  border-radius:16px;
  overflow:hidden;
  transition:border-color .2s;
}
.card:hover{border-color:var(--surface1);}
.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.75rem .9rem;
  border-bottom:1px solid var(--surface0);
}
.card-title{display:flex;align-items:center;gap:7px;font-weight:600;font-size:.82rem;color:var(--subtext1);}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.head-btns{display:flex;gap:4px;}
.icon-btn{
  background:none;
  border:none;
  color:var(--overlay1);
  cursor:pointer;
  font-size:.95rem;
  line-height:1;
  padding:2px 5px;
  border-radius:6px;
  transition:all .15s;
}
.icon-btn:hover{background:var(--surface0);color:var(--text);}
.icon-btn.del-section{color:var(--red);opacity:.7;}
.icon-btn.del-section:hover{opacity:1;}
.links{display:flex;flex-direction:column;padding:.4rem;}
.lk{
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 6px;
  border-radius:8px;
  text-decoration:none;
  color:var(--subtext1);
  font-size:.8rem;
  transition:background .15s,color .15s;
}
.lk:hover{background:var(--surface0);color:var(--text);}
.fav{
  width:16px;height:16px;
  border-radius:3px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  color:var(--base);
  font-weight:800;
  overflow:hidden;
}
.fav img{width:100%;height:100%;object-fit:contain;border-radius:3px;}
.lk-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.del-lk{
  display:none;
  background:none;
  border:none;
  color:var(--red);
  cursor:pointer;
  font-size:.72rem;
  padding:0 3px;
  opacity:.8;
}
.lk:hover .del-lk{display:block;}
.empty-lk{color:var(--overlay0);font-size:.75rem;text-align:center;padding:.7rem 0;}

/* ── RIGHT COLUMN ── */
.right-col{display:flex;flex-direction:column;gap:.85rem;}

/* Pomodoro */
.pomo{
  background:var(--mantle);
  border:1.5px solid var(--surface0);
  border-radius:16px;
  padding:1rem;
}
.pomo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;}
.pomo-title{font-size:.8rem;font-weight:700;color:var(--subtext1);letter-spacing:.04em;}
.pomo-tabs{display:flex;gap:4px;}
.ptab{
  background:none;
  border:1.5px solid var(--surface0);
  border-radius:7px;
  padding:.25rem .5rem;
  color:var(--overlay1);
  font-size:.68rem;
  cursor:pointer;
  font-family:'Syne',sans-serif;
  transition:all .15s;
}
.ptab.active{border-color:var(--mauve);color:var(--mauve);background:rgba(203,166,247,.1);}
.pomo-ring-wrap{display:flex;justify-content:center;margin-bottom:.8rem;}
.pomo-ring{position:relative;width:120px;height:120px;}
.pomo-ring svg{transform:rotate(-90deg);}
.pomo-ring circle{fill:none;stroke-width:6;}
.pomo-ring .track{stroke:var(--surface0);}
.pomo-ring .prog{stroke:var(--mauve);stroke-linecap:round;transition:stroke-dashoffset .5s,stroke .3s;}
.pomo-time{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:1.6rem;font-weight:200;
  color:var(--lavender);
}
.pomo-controls{display:flex;gap:6px;justify-content:center;}
.pomo-btn{
  background:var(--surface0);
  border:1.5px solid var(--surface1);
  border-radius:9px;
  padding:.4rem .9rem;
  color:var(--text);
  font-size:.78rem;
  cursor:pointer;
  font-family:'Syne',sans-serif;
  transition:all .15s;
  font-weight:600;
}
.pomo-btn:hover{background:var(--surface1);}
.pomo-btn.primary{background:var(--mauve);border-color:var(--mauve);color:var(--base);}
.pomo-btn.primary:hover{opacity:.85;}
.pomo-sessions{text-align:center;margin-top:.6rem;font-size:.7rem;color:var(--overlay1);}
.pomo-dots{display:flex;justify-content:center;gap:5px;margin-top:.3rem;}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--surface0);}
.pdot.done{background:var(--mauve);}

/* Tasks */
.tasks-card{
  background:var(--mantle);
  border:1.5px solid var(--surface0);
  border-radius:16px;
  overflow:hidden;
}
.tasks-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.75rem .9rem;
  border-bottom:1px solid var(--surface0);
}
.tasks-title{font-size:.8rem;font-weight:700;color:var(--subtext1);}
.tasks-meta{font-size:.68rem;color:var(--overlay0);}
.tasks-list{padding:.5rem;max-height:220px;overflow-y:auto;}
.tasks-list::-webkit-scrollbar{width:4px;}
.tasks-list::-webkit-scrollbar-thumb{background:var(--surface1);border-radius:2px;}
.task-item{
  display:flex;align-items:center;gap:7px;
  padding:5px 6px;border-radius:7px;
  transition:background .15s;cursor:pointer;
}
.task-item:hover{background:var(--surface0);}
.task-cb{
  width:14px;height:14px;
  border-radius:3px;
  border:1.5px solid var(--surface2);
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;cursor:pointer;
}
.task-cb.checked{background:var(--green);border-color:var(--green);}
.task-cb.checked::after{content:'✓';font-size:9px;color:var(--base);font-weight:800;}
.task-text{font-size:.8rem;flex:1;transition:color .15s;}
.task-text.done{color:var(--overlay0);text-decoration:line-through;}
.task-del{
  display:none;background:none;border:none;
  color:var(--red);cursor:pointer;font-size:.72rem;padding:0 3px;opacity:.8;
}
.task-item:hover .task-del{display:block;}
.task-add-row{display:flex;gap:6px;padding:.5rem;}
.task-input{
  flex:1;
  background:var(--surface0);
  border:1.5px solid var(--surface1);
  border-radius:8px;
  padding:.4rem .7rem;
  color:var(--text);
  font-size:.78rem;
  font-family:'Syne',sans-serif;
  outline:none;
  transition:border-color .2s;
}
.task-input:focus{border-color:var(--teal);}
.task-input::placeholder{color:var(--overlay0);}
.task-add-btn{
  background:var(--teal);color:var(--base);
  border:none;border-radius:8px;
  padding:.4rem .7rem;cursor:pointer;
  font-weight:700;font-size:.85rem;
  transition:opacity .15s;
}
.task-add-btn:hover{opacity:.85;}

/* Modal */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(17,17,27,.85);
  z-index:200;
  align-items:center;justify-content:center;
  backdrop-filter:blur(3px);
}
.modal-bg.open{display:flex;}
.modal{
  background:var(--mantle);
  border:1.5px solid var(--surface1);
  border-radius:16px;
  padding:1.5rem;
  width:360px;max-width:92vw;
}
.modal h3{color:var(--text);font-size:.9rem;font-weight:700;margin-bottom:1.1rem;}
.modal label{
  display:block;color:var(--subtext0);
  font-size:.68rem;margin-bottom:3px;
  letter-spacing:.05em;text-transform:uppercase;
}
.modal input,.modal select{
  width:100%;
  background:var(--surface0);
  border:1.5px solid var(--surface1);
  border-radius:8px;
  padding:.5rem .75rem;
  color:var(--text);
  font-size:.85rem;
  font-family:'Syne',sans-serif;
  outline:none;margin-bottom:.85rem;
}
.modal input:focus,.modal select:focus{border-color:var(--mauve);}
.modal input::placeholder{color:var(--overlay0);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:.2rem;}
.modal-btns button{
  border:none;border-radius:8px;
  padding:.45rem 1rem;cursor:pointer;
  font-size:.8rem;font-weight:700;
  font-family:'Syne',sans-serif;
}
.btn-c{background:var(--surface0);color:var(--subtext1);}
.btn-c:hover{background:var(--surface1);}
.btn-ok{background:var(--mauve);color:var(--base);}
.btn-ok:hover{opacity:.88;}
.color-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.85rem;}
.color-swatch{
  width:22px;height:22px;border-radius:50%;
  cursor:pointer;border:2px solid transparent;
  transition:all .15s;
}
.color-swatch.selected{border-color:var(--text);transform:scale(1.15);}

.hint{color:var(--overlay0);font-size:.68rem;text-align:center;margin-top:1.5rem;letter-spacing:.02em;}
.hint b{color:var(--subtext0);font-weight:500;}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="streak-block" id="streak-block"></div>
    <div class="clock-block" id="clock-block"></div>
    <div style="width:180px;"></div>
  </div>

  <div class="search-wrap">
    <input id="si" placeholder="Search or enter URL…" autocomplete="off"/>
    <button class="engine-btn" id="eng-btn"></button>
    <button class="search-btn" id="search-btn">Go →</button>
  </div>

  <div class="main-row">
    <div>
      <div class="section-header">
        <span class="section-header-label">Bookmarks</span>
        <button class="add-section-btn" id="add-section-btn">＋ Add section</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="right-col">
      <div id="pomo-widget"></div>
      <div id="tasks-widget"></div>
    </div>
  </div>

  <div class="hint">
    <b>⌘/Ctrl+K</b> focus search · <b>Enter</b> to search · <b>Esc</b> close dialog
  </div>
</div>

<!-- Add link modal -->
<div class="modal-bg" id="modal-link">
  <div class="modal">
    <h3 id="ml-title">Add link</h3>
    <label>Label</label>
    <input id="ml-lbl" placeholder="e.g. crates.io"/>
    <label>URL</label>
    <input id="ml-url" placeholder="https://…"/>
    <div class="modal-btns">
      <button class="btn-c" id="ml-cancel">Cancel</button>
      <button class="btn-ok" id="ml-confirm">Add link</button>
    </div>
  </div>
</div>

<!-- Add section modal -->
<div class="modal-bg" id="modal-sec">
  <div class="modal">
    <h3>Add section</h3>
    <label>Section name</label>
    <input id="ms-name" placeholder="e.g. Design"/>
    <label>Color</label>
    <div class="color-row" id="color-row"></div>
    <div class="modal-btns">
      <button class="btn-c" id="ms-cancel">Cancel</button>
      <button class="btn-ok" id="ms-confirm">Add section</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIG — edit these to customise your dashboard
// ═══════════════════════════════════════════════
const CONFIG = {
  streak: {
    startDate: '2026-04-17', // YYYY-MM-DD local date you started
    totalDays: 180,
    label: 'Coding',
  },
  pomodoro: {
    sessions: 4,
    focus:  25,   // minutes
    short:  5,
    long:   15,
  },
  search: {
    engines: {
      DDG:    'https://duckduckgo.com/?q=',
      Google: 'https://google.com/search?q=',
      Brave:  'https://search.brave.com/search?q=',
      Kagi:   'https://kagi.com/search?q=',
    },
  },
};

const PALETTE = [
  '#fab387','#89b4fa','#cba6f7','#a6e3a1',
  '#f9e2af','#74c7ec','#f38ba8','#94e2d5',
  '#b4befe','#f5c2e7','#eba0ac',
];

const DEFAULT_SECTIONS = [
  { id:'rust', label:'Rust', color:'#fab387', links:[
    { label:'crates.io',         url:'https://crates.io',                     bg:'#fab387' },
    { label:'docs.rs',           url:'https://docs.rs',                        bg:'#f38ba8' },
    { label:'Rust Book',         url:'https://doc.rust-lang.org/book/',        bg:'#eba0ac' },
    { label:'Playground',        url:'https://play.rust-lang.org',             bg:'#f9e2af' },
    { label:'This Week in Rust', url:'https://this-week-in-rust.org',          bg:'#94e2d5' },
  ]},
  { id:'devops', label:'DevOps', color:'#89b4fa', links:[
    { label:'NixOS Options',  url:'https://search.nixos.org/options',  bg:'#89b4fa' },
    { label:'NixOS Packages', url:'https://search.nixos.org/packages', bg:'#74c7ec' },
    { label:'GitHub',         url:'https://github.com',                bg:'#cba6f7' },
    { label:'Docker Hub',     url:'https://hub.docker.com',            bg:'#74c7ec' },
    { label:'Grafana',        url:'https://grafana.com',               bg:'#a6e3a1' },
  ]},
  { id:'ai', label:'AI', color:'#cba6f7', links:[
    { label:'Claude',          url:'https://claude.ai',                        bg:'#cba6f7' },
    { label:'ChatGPT',         url:'https://chatgpt.com',                      bg:'#a6e3a1' },
    { label:'Hugging Face',    url:'https://huggingface.co',                   bg:'#f9e2af' },
    { label:'Arxiv AI',        url:'https://arxiv.org/list/cs.AI/recent',      bg:'#89b4fa' },
    { label:'Papers With Code',url:'https://paperswithcode.com',               bg:'#94e2d5' },
  ]},
  { id:'entertainment', label:'Entertainment', color:'#a6e3a1', links:[
    { label:'YouTube',    url:'https://youtube.com',    bg:'#f38ba8' },
    { label:'Twitch',     url:'https://twitch.tv',      bg:'#cba6f7' },
    { label:'Reddit',     url:'https://reddit.com',     bg:'#fab387' },
    { label:'Letterboxd', url:'https://letterboxd.com', bg:'#89b4fa' },
  ]},
];


// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function faviconUrl(url) {
  try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=32`; }
  catch { return null; }
}

/** Parse YYYY-MM-DD as a **local** date (avoids UTC-shift bug). */
function parseLocalDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d); // month is 0-indexed
}

/** Floor two dates to midnight and return difference in whole days. */
function daysBetween(a, b) {
  const msPerDay = 1000 * 60 * 60 * 24;
  const aDay = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const bDay = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.floor((bDay - aDay) / msPerDay);
}


// ═══════════════════════════════════════════
// MODULE: STORAGE
// ═══════════════════════════════════════════
const Storage = {
  get(key, fallback = null) {
    try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
  todayKey(prefix) {
    const d = new Date();
    return `${prefix}-${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  },
};


// ═══════════════════════════════════════════
// MODULE: CLOCK
// ═══════════════════════════════════════════
const Clock = (() => {
  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];

  function greeting(h) {
    if (h < 5)  return 'Good night';
    if (h < 12) return 'Good morning';
    if (h < 17) return 'Good afternoon';
    if (h < 21) return 'Good evening';
    return 'Good night';
  }

  function render() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    $('clock-block').innerHTML = `
      <div class="clock-time">${h}:${m}</div>
      <div class="clock-date">${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}</div>
      <div class="greeting">${greeting(now.getHours())}</div>
    `;
  }

  function init() { render(); setInterval(render, 10_000); }
  return { init };
})();


// ═══════════════════════════════════════════
// MODULE: STREAK
// ═══════════════════════════════════════════
const Streak = (() => {
  function render() {
    const { startDate, totalDays, label } = CONFIG.streak;
    const start = parseLocalDate(startDate);
    const today = new Date();
    // +1 because day 1 = the start date itself
    const day = Math.min(Math.max(daysBetween(start, today) + 1, 1), totalDays);
    const pct = Math.round((day / totalDays) * 100);
    const remaining = totalDays - day;

    $('streak-block').innerHTML = `
      <div class="streak-label">${esc(label)}</div>
      <div class="streak-num">${day}</div>
      <div class="streak-sub">day${day === 1 ? '' : 's'} in · ${remaining} remaining</div>
      <div class="streak-bar-wrap">
        <div class="streak-bar" style="width:${pct}%"></div>
      </div>
    `;
  }

  function init() { render(); }
  return { init };
})();


// ═══════════════════════════════════════════
// MODULE: SEARCH
// ═══════════════════════════════════════════
const Search = (() => {
  const engines = CONFIG.search.engines;
  const keys = Object.keys(engines);
  let idx = 0;

  function updateBtn() { $('eng-btn').textContent = keys[idx]; }

  function cycle() { idx = (idx + 1) % keys.length; updateBtn(); }

  function go() {
    const q = $('si').value.trim();
    if (!q) return;
    window.location.href = /^https?:\/\//.test(q) ? q : engines[keys[idx]] + encodeURIComponent(q);
  }

  function init() {
    updateBtn();
    $('eng-btn').addEventListener('click', cycle);
    $('search-btn').addEventListener('click', go);
    $('si').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }

  return { init, focus: () => $('si').focus() };
})();


// ═══════════════════════════════════════════
// MODULE: MODALS
// ═══════════════════════════════════════════
const Modal = (() => {
  function open(id)  { $(id).classList.add('open'); }
  function close(id) { $(id).classList.remove('open'); }

  function init() {
    ['modal-link','modal-sec'].forEach(id => {
      $(id).addEventListener('click', e => { if (e.target === $(id)) close(id); });
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { close('modal-link'); close('modal-sec'); }
    });
    $('ml-cancel').addEventListener('click', () => close('modal-link'));
    $('ms-cancel').addEventListener('click', () => close('modal-sec'));
  }

  return { open, close, init };
})();


// ═══════════════════════════════════════════
// MODULE: BOOKMARKS
// ═══════════════════════════════════════════
const Bookmarks = (() => {
  let sections = Storage.get('ctp-sections', DEFAULT_SECTIONS);
  let pendingSec = null;
  let selectedColor = PALETTE[0];

  function save() { Storage.set('ctp-sections', sections); }

  function render() {
    const grid = $('grid');
    grid.innerHTML = '';
    sections.forEach((sec, si) => {
      const linksHtml = sec.links.length === 0
        ? '<div class="empty-lk">No links yet</div>'
        : sec.links.map((lk, li) => {
            const fav = faviconUrl(lk.url);
            const imgTag = fav
              ? `<img src="${fav}" alt="" loading="lazy" onerror="this.parentNode.style.background='${esc(lk.bg)}';this.outerHTML='${esc(lk.label.charAt(0).toUpperCase())}'">`
              : esc(lk.label.charAt(0).toUpperCase());
            const favStyle = fav ? '' : ` style="background:${esc(lk.bg)}"`;
            return `<a class="lk" href="${esc(lk.url)}" target="_blank" rel="noopener noreferrer">
              <div class="fav"${favStyle}>${imgTag}</div>
              <span class="lk-label">${esc(lk.label)}</span>
              <button class="del-lk" data-si="${si}" data-li="${li}">✕</button>
            </a>`;
          }).join('');

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div class="card-title">
            <div class="dot" style="background:${esc(sec.color)}"></div>
            <span>${esc(sec.label)}</span>
          </div>
          <div class="head-btns">
            <button class="icon-btn" data-add-link="${si}" title="Add link">＋</button>
            <button class="icon-btn del-section" data-del-sec="${si}" title="Remove section">✕</button>
          </div>
        </div>
        <div class="links">${linksHtml}</div>
      `;
      grid.appendChild(card);
    });

    // Delegated event listeners
    grid.querySelectorAll('[data-add-link]').forEach(btn =>
      btn.addEventListener('click', () => openAddLink(+btn.dataset.addLink)));
    grid.querySelectorAll('[data-del-sec]').forEach(btn =>
      btn.addEventListener('click', () => delSection(+btn.dataset.delSec)));
    grid.querySelectorAll('.del-lk').forEach(btn =>
      btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); delLink(+btn.dataset.si, +btn.dataset.li); }));
  }

  function openAddLink(si) {
    pendingSec = si;
    $('ml-lbl').value = '';
    $('ml-url').value = '';
    $('ml-title').textContent = 'Add to ' + sections[si].label;
    Modal.open('modal-link');
    setTimeout(() => $('ml-lbl').focus(), 50);
  }

  function confirmAddLink() {
    const label = $('ml-lbl').value.trim();
    let url = $('ml-url').value.trim();
    if (!label || !url) return;
    if (!/^https?:\/\//.test(url)) url = 'https://' + url;
    const bg = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    sections[pendingSec].links.push({ label, url, bg });
    save(); render(); Modal.close('modal-link');
  }

  function delLink(si, li) {
    sections[si].links.splice(li, 1);
    save(); render();
  }

  function delSection(si) {
    if (!confirm(`Remove section "${sections[si].label}"?`)) return;
    sections.splice(si, 1);
    save(); render();
  }

  function openAddSection() {
    $('ms-name').value = '';
    selectedColor = PALETTE[0];
    const row = $('color-row');
    row.innerHTML = PALETTE.map(c =>
      `<div class="color-swatch${c === selectedColor ? ' selected' : ''}" style="background:${c}" data-color="${c}"></div>`
    ).join('');
    row.querySelectorAll('.color-swatch').forEach(sw =>
      sw.addEventListener('click', () => {
        selectedColor = sw.dataset.color;
        row.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
      })
    );
    Modal.open('modal-sec');
    setTimeout(() => $('ms-name').focus(), 50);
  }

  function confirmAddSection() {
    const name = $('ms-name').value.trim();
    if (!name) return;
    sections.push({ id: 'sec-' + Date.now(), label: name, color: selectedColor, links: [] });
    save(); render(); Modal.close('modal-sec');
  }

  function init() {
    render();
    $('add-section-btn').addEventListener('click', openAddSection);
    $('ml-confirm').addEventListener('click', confirmAddLink);
    $('ms-confirm').addEventListener('click', confirmAddSection);
    $('ml-url').addEventListener('keydown', e => { if (e.key === 'Enter') confirmAddLink(); });
  }

  return { init };
})();


// ═══════════════════════════════════════════
// MODULE: POMODORO
// ═══════════════════════════════════════════
const Pomodoro = (() => {
  const { sessions: SESSIONS, focus, short, long } = CONFIG.pomodoro;
  const MODES = {
    focus: { label:'Focus',       mins: focus, color:'#cba6f7' },
    short: { label:'Short break', mins: short, color:'#94e2d5' },
    long:  { label:'Long break',  mins: long,  color:'#89b4fa' },
  };

  let mode = 'focus';
  let total = focus * 60;
  let left  = focus * 60;
  let running = false;
  let timer   = null;
  let done    = 0;
  let sess    = 0;

  function mount() {
    $('pomo-widget').innerHTML = `
      <div class="pomo">
        <div class="pomo-header">
          <span class="pomo-title">Pomodoro</span>
          <div class="pomo-tabs">
            <button class="ptab active" id="pt-focus">Focus</button>
            <button class="ptab" id="pt-short">Short</button>
            <button class="ptab" id="pt-long">Long</button>
          </div>
        </div>
        <div class="pomo-ring-wrap">
          <div class="pomo-ring">
            <svg width="120" height="120">
              <circle class="track" cx="60" cy="60" r="54"/>
              <circle class="prog" id="pomo-prog" cx="60" cy="60" r="54"
                stroke-dasharray="339.29" stroke-dashoffset="0"/>
            </svg>
            <div class="pomo-time" id="pomo-display">25:00</div>
          </div>
        </div>
        <div class="pomo-controls">
          <button class="pomo-btn" id="pomo-reset">↺</button>
          <button class="pomo-btn primary" id="pomo-play">▶ Start</button>
          <button class="pomo-btn" id="pomo-skip">⏭</button>
        </div>
        <div class="pomo-sessions" id="pomo-sess"></div>
        <div class="pomo-dots" id="pomo-dots"></div>
      </div>
    `;

    ['focus','short','long'].forEach(m =>
      $('pt-' + m).addEventListener('click', () => setMode(m)));
    $('pomo-reset').addEventListener('click', reset);
    $('pomo-play').addEventListener('click',  toggle);
    $('pomo-skip').addEventListener('click',  skip);
  }

  function setMode(m) {
    if (running) return;
    mode  = m;
    total = MODES[m].mins * 60;
    left  = total;
    document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
    $('pt-' + m).classList.add('active');
    renderPomo();
  }

  function renderPomo() {
    const mm = String(Math.floor(left / 60)).padStart(2,'0');
    const ss = String(left % 60).padStart(2,'0');
    $('pomo-display').textContent = `${mm}:${ss}`;

    const circ = 339.29;
    const prog = circ * (1 - left / total);
    const el = $('pomo-prog');
    el.style.strokeDashoffset = prog;
    el.style.stroke = MODES[mode].color;

    $('pomo-play').textContent = running ? '⏸ Pause' : '▶ Start';
    $('pomo-sess').textContent = `Session ${sess + 1} of ${SESSIONS}`;
    $('pomo-dots').innerHTML = Array.from({ length: SESSIONS }, (_, i) =>
      `<div class="pdot${i < done ? ' done' : ''}"></div>`
    ).join('');
  }

  function toggle() {
    if (running) {
      clearInterval(timer);
      running = false;
    } else {
      running = true;
      timer = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(timer);
          running = false;
          onSessionEnd();
        }
        renderPomo();
      }, 1000);
    }
    renderPomo();
  }

  function onSessionEnd() {
    if (mode === 'focus') {
      done = Math.min(done + 1, SESSIONS);
      sess = (sess + 1) % SESSIONS;
      if (done >= SESSIONS) done = 0;
      setMode(sess === 0 ? 'long' : 'short');
    } else {
      setMode('focus');
    }
  }

  function reset() { clearInterval(timer); running = false; left = total; renderPomo(); }

  function skip() {
    clearInterval(timer); running = false; left = 0;
    onSessionEnd();
    renderPomo();
  }

  function init() { mount(); renderPomo(); }
  return { init };
})();


// ═══════════════════════════════════════════
// MODULE: TASKS
// ═══════════════════════════════════════════
const Tasks = (() => {
  const KEY = () => Storage.todayKey('tasks');
  const load = () => Storage.get(KEY(), []);
  const save = t  => Storage.set(KEY(), t);

  function mount() {
    $('tasks-widget').innerHTML = `
      <div class="tasks-card">
        <div class="tasks-head">
          <span class="tasks-title">Today's tasks</span>
          <span class="tasks-meta" id="tasks-meta"></span>
        </div>
        <div class="tasks-list" id="tasks-list"></div>
        <div class="task-add-row">
          <input class="task-input" id="task-input" placeholder="Add a task…"/>
          <button class="task-add-btn" id="task-add-btn">＋</button>
        </div>
      </div>
    `;
    $('task-add-btn').addEventListener('click', add);
    $('task-input').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  }

  function render() {
    const tasks = load();
    const doneCount = tasks.filter(t => t.done).length;
    $('tasks-meta').textContent = `${doneCount}/${tasks.length} done`;

    $('tasks-list').innerHTML = tasks.length === 0
      ? '<div style="color:var(--overlay0);font-size:.75rem;text-align:center;padding:.7rem 0;">No tasks for today</div>'
      : tasks.map((t, i) => `
          <div class="task-item" data-toggle="${i}">
            <div class="task-cb${t.done ? ' checked' : ''}"></div>
            <span class="task-text${t.done ? ' done' : ''}">${esc(t.text)}</span>
            <button class="task-del" data-del="${i}">✕</button>
          </div>
        `).join('');

    $('tasks-list').querySelectorAll('[data-toggle]').forEach(el =>
      el.addEventListener('click', () => toggle(+el.dataset.toggle)));
    $('tasks-list').querySelectorAll('[data-del]').forEach(btn =>
      btn.addEventListener('click', e => { e.stopPropagation(); del(+btn.dataset.del); }));
  }

  function add() {
    const input = $('task-input');
    const text  = input.value.trim();
    if (!text) return;
    const tasks = load();
    tasks.push({ text, done: false });
    save(tasks); input.value = ''; render();
  }

  function toggle(i) {
    const tasks = load();
    tasks[i].done = !tasks[i].done;
    save(tasks); render();
  }

  function del(i) {
    const tasks = load();
    tasks.splice(i, 1);
    save(tasks); render();
  }

  function init() { mount(); render(); }
  return { init };
})();
