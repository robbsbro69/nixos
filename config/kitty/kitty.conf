# ── kitty — catppuccin-pink, matches the Hyprland blur ──────────────

# font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.5
modify_font      cell_height 112%
disable_ligatures cursor

# window
window_padding_width 10 14
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.78
dynamic_background_opacity yes
enable_audio_bell no
scrollback_lines 10000
shell_integration enabled
mouse_hide_wait 3.0

# cursor — beam with a pink comet trail
cursor               #f5c2e7
cursor_text_color    #0f0f17
cursor_shape         beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
cursor_stop_blinking_after 12
cursor_trail         3
cursor_trail_decay   0.08 0.35
cursor_trail_start_threshold 2

# links
url_color #b4befe
url_style curly
detect_urls yes

# tabs — slanted powerline, pink active tab
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}  {title[:24]}"
active_tab_foreground   #0f0f17
active_tab_background   #f5c2e7
active_tab_font_style   bold
inactive_tab_foreground #a6adc8
inactive_tab_background #1e1e2e
tab_bar_background      none

# split borders
active_border_color   #f5c2e7
inactive_border_color #45475a
window_border_width   1pt

# ── colours (yours, unchanged) ───────────────────────────────────────
background              #0f0f17
foreground              #dce0f8
selection_foreground    #0f0f17
selection_background    #f5c2e7

color0  #1a1b26
color1  #ff5c8f
color2  #8aff80
color3  #ffdd77
color4  #f5c2e7
color5  #b4befe
color6  #4ef0c3
color7  #c6d0f5

color8  #44475a
color9  #ff6e9e
color10 #a3ff9e
color11 #ffe29a
color12 #f5c2e7
color13 #e1b3ff
color14 #7ffce2
color15 #ffffff

# handy: ctrl+shift+a then m/l = more/less transparent, d = default
map ctrl+shift+a>m set_background_opacity +0.1
map ctrl+shift+a>l set_background_opacity -0.1
map ctrl+shift+a>d set_background_opacity default
