exec-once = ssh-add /home/alpha/.ssh/id_ed25519
exec-once = swww-daemon
exec-once = wal -R -n
exec-once = [workspace 9 silent] spotify
exec-once = [workspace 10 silent] sleep 3 && env ELECTRON_OZONE_PLATFORM_HINT=auto appimage-run $(ls /home/alpha/AppImages/ticktick/*.AppImage | tail -1)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = gammastep -O 3000
exec-once = /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1
exec-once = sleep 1 && QS_DROP_EXPENSIVE_FONTS=1 quickshell -p /home/alpha/.config/quickshell
