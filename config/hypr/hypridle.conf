
general {
    lock_cmd        = pidof hyprlock || hyprlock   # don't spawn multiple instances
    before_sleep_cmd = loginctl lock-session        # lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on     # turn display back on after wake
}

listener {
    timeout  = 300                          # 300s = 5 min (same as your swayidle timeout)
    on-timeout = loginctl lock-session      # lock the session
}

listener {
    timeout  = 360                          # 6 min — turn off display after locking
    on-timeout  = hyprctl dispatch dpms off
    on-resume   = hyprctl dispatch dpms on
}
