# hyprlock — matches the desktop: blurred wall, glowing pywal accents
# colours come from pywal (template ~/.config/wal/templates/colors-hyprlock.conf)
source = ~/.cache/wal/colors-hyprlock.conf
$S = ~/nixos-dotfiles/config/hypr/hyprlock
$font = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    ignore_empty_input = true
}

background {
    path        = ~/wallpapers/.current-blurred.jpg
    blur_passes = 3
    blur_size   = 10
    brightness  = 0.45
    vibrancy    = 0.2
}

# ── clock + date ─────────────────────────────────────────────
label {
    text          = cmd[update:1000] date +'%-I:%M %p'
    color         = $accent
    font_size     = 110
    font_family   = $font
    position      = 0, 250
    halign        = center
    valign        = center
    shadow_passes = 3
    shadow_size   = 8
    shadow_color  = $accentGlow
    shadow_boost  = 1.3
}
label {
    text        = cmd[update:60000] date +'%A, %-d %B'
    color       = $fg
    font_size   = 20
    font_family = $font
    position    = 0, 150
    halign      = center
    valign      = center
}

# ── greeting + password ──────────────────────────────────────
label {
    text        = 󰌾   welcome back, robbbs
    color       = $muted
    font_size   = 13
    font_family = $font
    position    = 0, 35
    halign      = center
    valign      = center
}
input-field {
    size              = 300, 54
    outline_thickness = 3
    outer_color       = $accent $accent2 45deg
    inner_color       = $bgSoft
    font_color        = $fg
    font_family       = $font
    check_color       = $accent2 $accent 45deg
    fail_color        = $bad
    fail_text         = <i>nope — $ATTEMPTS</i>
    placeholder_text  = <i>password…</i>
    dots_size         = 0.25
    dots_spacing      = 0.4
    dots_center       = true
    rounding          = 14
    hide_input        = false
    fade_on_empty     = false
    shadow_passes     = 3
    shadow_size       = 10
    shadow_color      = $accentGlow
    position          = 0, -30
    halign            = center
    valign            = center
}

# ── Jarvis: next up ──────────────────────────────────────────
label {
    text        = cmd[update:60000] $S/jarvis.sh
    color       = $accent2
    font_size   = 14
    font_family = $font
    position    = 0, 70
    halign      = center
    valign      = bottom
}

# ── now playing (art + title) ────────────────────────────────
image {
    path          = ~/nixos-dotfiles/config/hypr/hyprlock/blank.png
    reload_time   = 3
    reload_cmd    = $S/art.sh
    size          = 72
    rounding      = 12
    border_size   = 0
    position      = 40, 40
    halign        = left
    valign        = bottom
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = $accentGlow
}
label {
    text        = cmd[update:2000] $S/np.sh
    color       = $fg
    font_size   = 13
    font_family = $font
    position    = 128, 52
    halign      = left
    valign      = bottom
}

# ── battery ──────────────────────────────────────────────────
label {
    text        = cmd[update:30000] $S/battery.sh
    color       = $fg
    font_size   = 14
    font_family = $font
    position    = -40, -30
    halign      = right
    valign      = top
}
